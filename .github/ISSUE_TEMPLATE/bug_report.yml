name: Bug report
description: Something in Hearthwild isn't working right.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: The release you're playing, e.g. 0.19.0.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Where are you playing?
      options: [Desktop app on macOS, Desktop app on Windows, Desktop app on Linux, Web browser, Running from source]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: errors
    attributes:
      label: Errors or screenshots
      description: Anything from the browser console or the server window helps.
