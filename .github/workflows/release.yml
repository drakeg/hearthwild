# Builds Hearthwild for macOS, Windows and Linux and publishes a GitHub release
# whenever the version in package.json changes on main (or when run by hand).
# After a release, it also releases any earlier version a merge skipped: when stacked pull
# requests merge together, the versions in between never got their own run (HW-101).
name: Release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit to release (defaults to the branch's latest)"
        required: false

permissions:
  contents: write
  actions: write

# One run per commit at a time; different versions may release side by side.
concurrency:
  group: release-${{ inputs.commit || github.sha }}
  cancel-in-progress: false

env:
  TARGET: ${{ inputs.commit || github.sha }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null | grep -q false; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$V is already published; nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run tests
        if: steps.v.outputs.exists == 'false'
        run: node --test tests/*.test.js

  mac:
    needs: check
    if: needs.check.outputs.exists == 'false'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm install --no-save @electron/packager@20.3.0
      - name: Build Mac installers
        run: |
          V=${{ needs.check.outputs.version }}
          mkdir -p release
          for pair in "arm64:Apple-Silicon" "x64:Intel"; do
            ARCH=${pair%%:*}; NAME=${pair##*:}
            node tools/pack.mjs darwin "$ARCH" dist
            APP="dist/Hearthwild-darwin-$ARCH/Hearthwild.app"
            codesign --force --deep --sign - "$APP"
            pkgbuild --component "$APP" --install-location /Applications \
              --identifier com.hearthwild.game --version "$V" \
              "release/Hearthwild-$V-Mac-$NAME.pkg"
          done
          ls -la release
      - uses: actions/upload-artifact@v7
        with:
          name: mac
          path: release/*

  windows-linux:
    needs: check
    if: needs.check.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET }}
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm install --no-save @electron/packager@20.3.0
      - name: Build Windows and Linux packages
        run: |
          V=${{ needs.check.outputs.version }}
          mkdir -p release
          node tools/pack.mjs win32 x64 dist
          (cd dist && mv Hearthwild-win32-x64 Hearthwild && zip -qry "../release/Hearthwild-$V-Windows-x64.zip" Hearthwild)
          node tools/pack.mjs linux x64 dist
          (cd dist && mv Hearthwild-linux-x64 "hearthwild-$V" && tar -czf "../release/Hearthwild-$V-Linux-x64.tar.gz" "hearthwild-$V")
          # Smoke test: the bundled runtime starts the game server and reports this version.
          cd "dist/hearthwild-$V"
          ELECTRON_RUN_AS_NODE=1 timeout 60 ./hearthwild -e "import('./resources/app/server/http.js').then(async m=>{const a=m.createGameServer({dataDir:'/tmp/smoke'});a.server.listen(4329,'127.0.0.1',async()=>{const j=await (await fetch('http://127.0.0.1:4329/api/info')).json();console.log('smoke',j.version);process.exit(j.version==='$V'?0:1)})})"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-linux
          path: release/*

  publish:
    needs: [check, mac, windows-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET }}
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ needs.check.outputs.version }}
          cd release && sha256sum *.pkg *.zip *.tar.gz > SHA256SUMS.txt && cd ..
          python3 tools/release-notes.py "$V" > notes.md
          TITLE=$(grep -m1 "^## $V" CHANGELOG.md | sed "s/^## $V — //")
          # Replace any half-finished draft left by an earlier attempt.
          gh release delete "v$V" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "v$V" --repo "$GITHUB_REPOSITORY" --target "$TARGET" \
            --title "Hearthwild $V — ${TITLE:-Release}" --notes-file notes.md release/*

  # Releases any version with a CHANGELOG entry but no GitHub Release, each from the commit
  # that set that version in package.json.
  catch-up:
    needs: [check, publish]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Release skipped versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          COUNT=0
          for V in $(grep -oE '^## [0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | cut -c4- | head -12); do
            [ "$V" = "$CURRENT" ] && continue
            # Downloads for every OS began with 0.8.0; earlier versions predate the packaging.
            [ "$(printf '%s\n' 0.8.0 "$V" | sort -V | head -1)" = 0.8.0 ] || continue
            if gh release view "v$V" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null | grep -q false; then continue; fi
            SHA=$(git log --reverse --format=%H -G"\"version\": \"$V\"" -- package.json | head -1)
            if [ -z "$SHA" ] || [ "$(git show "$SHA:package.json" | node -e 'process.stdin.on("data",d=>console.log(JSON.parse(d).version))')" != "$V" ]; then
              echo "No commit sets version $V; skipping."
              continue
            fi
            echo "Releasing skipped version $V from $SHA"
            gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "${GITHUB_REF_NAME}" -f commit="$SHA"
            COUNT=$((COUNT + 1))
            [ "$COUNT" -ge 4 ] && break
          done
          echo "Started $COUNT catch-up release(s)."
